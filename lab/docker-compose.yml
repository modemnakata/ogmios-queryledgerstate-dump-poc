name: ogmios-dump-poc-lab

# Reproducible environment for the Ogmios queryLedgerState/dump PoC.
# Brings up cardano-node (preview testnet) + Ogmios, both on host networking.

services:
  node:
    image: ghcr.io/intersectmbo/cardano-node:11.1.3
    network_mode: host
    container_name: ogmios-poc-node
    volumes:
      - ./preview/cardano-node:/config:ro
      - ./preview/genesis:/genesis:ro
      - ./data/db:/lab/db
      - ./data/ipc:/lab/ipc
    # The cardano-node image ships a wrapper entrypoint that intercepts argv;
    # bypass it so the raw binary receives our arguments.
    entrypoint: ["cardano-node"]
    command:
      - run
      - --config
      - /config/config.json
      - --database-path
      - /lab/db
      - --socket-path
      - /lab/ipc/node.socket
      - --topology
      - /config/topology.json
    healthcheck:
      test: ["CMD-SHELL", "test -S /lab/ipc/node.socket"]
      interval: 5s
      timeout: 5s
      retries: 30

  ogmios:
    image: cardanosolutions/ogmios:latest
    network_mode: host
    container_name: ogmios-poc-ogmios
    depends_on:
      node:
        condition: service_healthy
    volumes:
      - ./preview:/config:ro
      - ./data/ipc:/ipc:rw
      # Evidence dir. The PoC writes here; `--host-prefix ./lab/evidence`
      # lets it verify the files from the host.
      - ./evidence:/evidence
    command:
      - --host
      - 127.0.0.1
      - --port
      - "1337"
      - --node-socket
      - /ipc/node.socket
      - --node-config
      - /config/cardano-node/config.json

  # One-shot: populates ./preview from the Ogmios image, which bundles the
  # network configs. Run once before the first `docker compose up`.
  fetch-config:
    image: cardanosolutions/ogmios:latest
    profiles: ["setup"]
    entrypoint: ["sh", "-c"]
    command:
      - cd /config/preview && tar cf - cardano-node genesis > /out/preview.tar
    volumes:
      - ./preview:/out